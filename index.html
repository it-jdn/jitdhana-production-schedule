<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap">
<title>ตารางเวลาการทำงานของผู้ปฏิบัติงาน</title>
<style>
:root {
  --bg: #fff;
  --surface: #fff;
  --sf-dim: #f8f9fa;
  --sf-hover: #f1f3f4;
  --border: #dadce0;
  --name-w: 84px;
  --border-s: #bdc1c6;
  --text: #202124;
  --text-2: #5f6368;
  --text-3: #9aa0a6;
  --accent: #1a73e8;
  --accent-lt: #e8f0fe;
  --accent-dk: #1557b0;
  --red: #d93025;
  --yellow: #b06000;
  --topbar-h: 48px;
  --th-h: 40px;
  --row-h: 44px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;height:100%;}
body{
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100dvh;min-height:100dvh;overflow:hidden;
}

/* ─── Topbar ─── */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:60;
  background:
    linear-gradient(180deg,rgba(255,255,255,.1),rgba(0,0,0,.18)),
    linear-gradient(105deg,#06281d 0%,#0f5138 40%,#178a4e 72%,#0b3d2c 100%);
  box-shadow:0 2px 8px rgba(6,40,28,.4);
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  padding:6px max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left));
  min-height:var(--topbar-h);height:auto;flex-shrink:0;
}
.logo-wrap{display:flex;align-items:center;gap:10px;margin-right:4px;}
.logo-frame{
  width:40px;height:40px;flex-shrink:0;box-sizing:border-box;
  background:#fff;border-radius:8px;padding:3px;
  box-shadow:0 1px 2px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.16);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.logo-img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;}
.logo-text{display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;line-height:1.15;}
.app-title{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;letter-spacing:-.3px;}
.app-sub{font-size:11px;font-weight:500;color:rgba(255,255,255,.78);white-space:nowrap;font-family:'Noto Sans Thai',sans-serif;}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;}
.view-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.view-switch{
  display:flex;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);
  border-radius:16px;padding:2px;gap:2px;flex-shrink:0;
}
.view-switch a{
  font-size:12px;font-weight:600;text-decoration:none;color:rgba(255,255,255,.78);
  padding:4px 10px;border-radius:14px;font-family:'IBM Plex Sans Thai',sans-serif;
  transition:color .2s ease,background .2s ease;
}
.view-switch a.on{background:#fff;color:#0f5138;box-shadow:0 1px 2px rgba(0,0,0,.22);}
.date-chip{
  position:relative;display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;color:#fff;white-space:nowrap;
  padding:4px 10px 4px 8px;border-radius:16px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.14);cursor:pointer;flex-shrink:0;
  font-family:'IBM Plex Sans Thai',sans-serif;appearance:none;
}
.date-chip:hover{background:rgba(255,255,255,.24);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);}
.date-chip svg{width:16px;height:16px;flex-shrink:0;}
.search-bubble{
  position:fixed;z-index:250;
  right:max(10px,env(safe-area-inset-right));
  bottom:max(10px,env(safe-area-inset-bottom));
  display:flex;align-items:center;
  height:28px;width:28px;border-radius:14px;overflow:hidden;
  background:#3c4043;
  box-shadow:0 2px 8px rgba(32,33,36,.28),0 1px 2px rgba(0,0,0,.18);
  transition:width .22s ease;
}
.search-bubble.open,.search-bubble.has-q{
  width:min(160px,calc(100vw - 20px));
  padding-right:4px;
}
.search-bubble.no-hit{box-shadow:0 2px 8px rgba(32,33,36,.28),0 0 0 2px rgba(255,180,180,.75);}
.search-fab{
  width:28px;height:28px;flex:0 0 28px;border:none;padding:0;
  background:transparent;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.search-fab svg{width:14px;height:14px;}
.search-bubble input{
  flex:1;min-width:0;width:0;opacity:0;pointer-events:none;
  border:none;outline:none;background:transparent;
  color:#fff;font-size:11px;font-weight:500;height:100%;
  font-family:'IBM Plex Sans Thai',sans-serif;
}
.search-bubble.open input,.search-bubble.has-q input{
  opacity:1;width:auto;pointer-events:auto;
}
.search-bubble input::placeholder{color:rgba(255,255,255,.72);}
.search-clear{
  display:none;align-items:center;justify-content:center;
  width:16px;height:16px;border:none;border-radius:50%;padding:0;
  background:transparent;color:#fff;cursor:pointer;font-size:11px;line-height:1;
  flex-shrink:0;
}
.search-bubble.has-q .search-clear{display:flex;}
.search-clear:hover{background:rgba(255,255,255,.22);}
#dpop{
  position:fixed;z-index:400;width:min(280px,calc(100vw - 16px));
  background:#fff;border-radius:16px;padding:12px 14px 14px;
  box-shadow:0 4px 6px -1px rgba(60,64,67,.25),0 10px 28px 4px rgba(60,64,67,.18);
}
.dpop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.dpop-title{font-size:14px;font-weight:600;color:var(--text);}
.dpop-nav{
  width:32px;height:32px;border:none;background:transparent;border-radius:50%;
  cursor:pointer;font-size:20px;line-height:1;color:var(--text-2);
}
.dpop-nav:hover{background:var(--sf-dim);color:var(--text);}
.dpop-dow{
  display:grid;grid-template-columns:repeat(7,1fr);text-align:center;
  font-size:11px;font-weight:600;color:var(--text-3);margin-bottom:4px;
}
.dpop-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.dpop-cell{
  height:36px;border:none;background:transparent;border-radius:50%;
  cursor:pointer;font-size:13px;font-weight:500;color:var(--text);
  font-family:'IBM Plex Sans Thai',sans-serif;
}
.dpop-cell:hover:not(.dpop-empty):not(.dpop-sel){background:var(--accent-lt);}
.dpop-empty{cursor:default;}
.dpop-sel{background:var(--accent);color:#fff;font-weight:600;}
.dpop-today:not(.dpop-sel){box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600;}
.btn-create{
  display:flex;align-items:center;gap:4px;
  background:#fff;color:#0f5138;
  border:none;border-radius:16px;
  padding:5px 12px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:'IBM Plex Sans Thai',sans-serif;white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,.22);
  transition:background .15s,box-shadow .15s;
}
.btn-create:hover{
  background:#e8f5ee;
  box-shadow:0 1px 3px rgba(0,0,0,.28);
}
.btn-create svg{width:16px;height:16px;fill:currentColor;}

/* ─── Time header ─── */
.th-band{
  position:sticky;top:0;z-index:50;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;height:var(--th-h);flex-shrink:0;
  box-shadow:0 1px 4px rgba(60,64,67,.1);
  width:max-content;min-width:100%;
}
.th-name-fixed{
  width:var(--name-w);flex-shrink:0;
  border-right:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  padding:0 6px;background:var(--surface);
  position:sticky;left:0;z-index:3;overflow:hidden;
}
.th-name-fixed span{
  font-size:9.5px;font-weight:600;color:var(--text-3);
  letter-spacing:.04em;text-transform:uppercase;text-align:center;
}
.th-axis-clip{flex:0 0 auto;overflow:hidden;position:relative;height:100%;z-index:0;}
.th-axis-inner{position:relative;height:100%;}
.tick{
  position:absolute;top:0;bottom:0;z-index:0;
  border-left:1px solid var(--border-s);
  pointer-events:none;width:0;
}
.tick.tick-end{
  left:auto;right:0;border-left:none;border-right:1px solid var(--border);
}
.slot{
  position:absolute;top:0;bottom:0;z-index:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;pointer-events:none;padding:0 1px;
}
.slot span{
  display:inline-block;
  font-family:'Sarabun',sans-serif;
  font-size:9px;color:var(--text-2);font-weight:600;white-space:nowrap;
  letter-spacing:-.03em;transform-origin:center;
}
.brk-th{
  position:absolute;top:0;bottom:0;overflow:hidden;z-index:0;
  background:#fef3f2;
  display:flex;align-items:center;justify-content:center;
  padding:0 1px;
  box-shadow:inset 1px 0 0 var(--border-s),inset -1px 0 0 var(--border-s);
}
.brk-th span{
  display:inline-block;
  font-family:'Sarabun',sans-serif;
  font-size:9px;font-weight:600;color:#c5221f;
  letter-spacing:-.03em;white-space:nowrap;transform-origin:center;
}

/* ─── Grid ─── */
.view-stage{
  flex:1;min-height:0;min-width:0;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-x pan-y;
  padding-bottom:env(safe-area-inset-bottom,0px);
  position:relative;z-index:0;isolation:isolate;
  display:flex;flex-direction:column;
}
.grid-inner{
  min-width:max-content;
  flex:1 1 auto;
  display:flex;flex-direction:column;
  min-height:0;
}
.row{
  display:flex;flex:1 1 0;
  min-height:var(--row-h);height:auto;
  border-bottom:1px solid var(--border);
}
.row-name{
  width:var(--name-w);flex-shrink:0;
  border-right:1px solid var(--border);
  display:flex;align-items:center;padding:0 6px;gap:6px;
  background:var(--surface);position:sticky;left:0;z-index:12;
}
.avatar{
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-size:11.5px;font-weight:600;color:#5f6368;line-height:1;
  font-family:'IBM Plex Sans Thai',sans-serif;
  background:#fff;box-shadow:inset 0 0 0 1px #dadce0;
}
.row-name-text{
  font-size:12.5px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;min-width:0;
}
.task-area{
  position:relative;background:var(--surface);cursor:crosshair;
  overflow:hidden;flex-shrink:0;align-self:stretch;
  touch-action:pan-x pan-y;
  box-shadow:inset 1px 0 0 rgba(218,220,224,.7),inset -1px 0 0 rgba(218,220,224,.7);
}
.task-area:hover{background:#f8fbff;}
.row:nth-child(even) .task-area{background:#fafbff;}
.row:nth-child(even) .task-area:hover{background:#f3f7ff;}
.vgrid{
  position:absolute;top:0;bottom:0;width:1px;
  background:rgba(218,220,224,.7);pointer-events:none;z-index:1;
}
.brk-col{
  position:absolute;top:0;bottom:0;
  background:repeating-linear-gradient(-45deg,transparent,transparent 4px,rgba(0,0,0,.03) 4px,rgba(0,0,0,.03) 8px);
  pointer-events:none;z-index:6;
  box-shadow:inset 1px 0 0 var(--border-s),inset -1px 0 0 var(--border-s);
}
.task{
  position:absolute;top:5px;bottom:5px;
  border-radius:5px;display:flex;align-items:center;
  padding:0 8px;cursor:pointer;overflow:hidden;
  transition:filter .2s,box-shadow .12s,transform .1s,opacity .2s;z-index:4;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
}
.task:hover{
  filter:brightness(.9);
  box-shadow:0 2px 8px rgba(60,64,67,.28),0 1px 3px rgba(60,64,67,.15);
  transform:translateY(-1px);
}
.task.task-pulse{
  outline:2.5px solid #fff;
  outline-offset:2px;
  z-index:9;
  overflow:visible;
  animation:taskPulse .7s ease-in-out infinite;
  box-shadow:0 0 0 2px #1a73e8,0 2px 8px rgba(26,115,232,.35);
}
.task.task-pulse:hover{transform:none;filter:none;}
@keyframes taskPulse{
  0%,100%{outline-color:#fff;box-shadow:0 0 0 2px #1a73e8,0 2px 10px rgba(26,115,232,.45);}
  50%{outline-color:rgba(255,255,255,.15);box-shadow:0 0 0 2px rgba(26,115,232,.2),0 1px 3px rgba(26,115,232,.12);}
}
@media(prefers-reduced-motion:reduce){
  .task.task-pulse,.row-name.row-pulse{animation:none;}
}
.grid-inner.is-pulsing .task:not(.task-pulse){
  filter:saturate(.2) brightness(1.22);
  opacity:.34;
  box-shadow:none;
}
.grid-inner.is-pulsing .task:not(.task-pulse):hover{
  filter:saturate(.35) brightness(1.12);
  opacity:.55;
  transform:none;
}
.row-name.row-pulse{
  outline:2px solid #fff;outline-offset:-2px;z-index:13;
  animation:taskPulse .7s ease-in-out infinite;
  box-shadow:0 0 0 2px #1a73e8;
}
.row.row-dim .row-name{opacity:.42;filter:saturate(.35);}
.row-name{transition:opacity .2s,filter .2s;}
.task span{
  font-family:'Sarabun',sans-serif;
  font-size:clamp(11.5px,.72vw + .4vh,16px);
  font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.ghost-task{
  position:absolute;top:5px;bottom:5px;
  background:var(--accent-lt);border:1.5px solid var(--accent);
  border-radius:6px;pointer-events:none;z-index:8;
  display:flex;align-items:center;justify-content:center;
  padding:0 4px;overflow:hidden;opacity:.85;line-height:1;
}
.ghost-task.ghost-hover{opacity:.72;}
.ghost-task.ghost-sel{opacity:1;box-shadow:0 0 0 2px rgba(26,115,232,.22);}
.ghost-task span{
  font-size:11px;font-weight:600;color:var(--accent);
  white-space:nowrap;font-family:'IBM Plex Mono',monospace;
}

/* ─── Add Popover ─── */
#apop{
  position:fixed;z-index:500;width:320px;
  background:var(--surface);border-radius:16px;overflow:auto;
  font-family:'Sarabun',sans-serif;
  box-shadow:0 4px 6px -1px rgba(60,64,67,.25),0 10px 28px 4px rgba(60,64,67,.18);
  animation:popIn .14s cubic-bezier(.22,1,.36,1);
}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(-6px);}to{opacity:1;transform:none;}}
.apop-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;}
.apop-hdr{display:flex;align-items:center;justify-content:space-between;}
.apop-title{font-size:16px;font-weight:600;color:var(--text);}
.apop-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:600;color:#5f6368;font-family:'Sarabun',sans-serif;line-height:1;background:#fff;box-shadow:inset 0 0 0 1px #dadce0;}
.apop-x{
  background:none;border:none;color:var(--text-3);cursor:pointer;
  font-size:18px;line-height:1;border-radius:50%;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  transition:background .1s;
}
.apop-x:hover{background:var(--sf-dim);color:var(--text-2);}
.apop-times{display:flex;align-items:center;gap:8px;}
.t-spin{
  flex:1;display:flex;align-items:center;gap:1px;
  border-bottom:2px solid var(--border);padding:6px 3px 4px;
  transition:border-color .15s;
}
.t-spin:focus-within{border-color:var(--accent);}
.t-part{
  width:28px;border:none;background:transparent;outline:none;
  font-family:'Sarabun',sans-serif;font-size:14px;font-weight:600;
  color:var(--text);text-align:center;padding:0;letter-spacing:.02em;
}
.t-colon{color:var(--text-2);font-size:14px;font-weight:600;font-family:'IBM Plex Mono',monospace;user-select:none;}
.apop-tsep{color:var(--text-3);font-size:13px;flex-shrink:0;}
.apop-warn{font-size:12px;padding:8px 12px;border-radius:8px;font-weight:500;line-height:1.45;}
.warn-brk{background:#fce8e6;color:#c5221f;}
.warn-ovlp{background:#fef7e0;color:#b06000;}
.apop-name{
  border:none;border-bottom:2px solid var(--border);
  padding:8px 0;font-size:14px;font-family:'Sarabun',sans-serif;
  color:var(--text);outline:none;width:100%;background:transparent;
  transition:border-color .15s;
}
.apop-name:focus{border-color:var(--accent);}
.apop-name::placeholder{color:var(--text-3);}
.apop-name.apop-err{border-color:var(--red);animation:shake .2s;}
@keyframes shake{0%,100%{transform:none;}33%{transform:translateX(-4px);}66%{transform:translateX(4px);}}
.apop-who-block{display:flex;flex-direction:column;gap:8px;}
.apop-who-lbl{font-size:12px;font-weight:600;color:var(--text-2);}
.apop-who-list{display:flex;flex-direction:column;gap:8px;}
.apop-who-row{display:flex;align-items:center;gap:8px;}
.apop-who-sel{
  flex:1;min-width:0;border:none;border-bottom:2px solid var(--border);
  background:transparent;outline:none;cursor:pointer;
  font-family:'Sarabun',sans-serif;font-size:14px;font-weight:600;
  color:var(--text);padding:6px 0;
}
.apop-who-sel:focus{border-color:var(--accent);}
.apop-who-rm{
  background:none;border:none;color:var(--text-3);cursor:pointer;
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.apop-who-rm:hover{background:var(--sf-dim);color:var(--text-2);}
.apop-who-row:only-child .apop-who-rm{visibility:hidden;pointer-events:none;}
.apop-who-add{
  align-self:flex-start;background:none;border:none;cursor:pointer;
  color:var(--accent);font-family:'Sarabun',sans-serif;
  font-size:13px;font-weight:600;padding:2px 0;
}
.apop-who-add:hover{color:var(--accent-dk);}
.apop-footer{display:flex;gap:6px;justify-content:flex-end;padding-top:2px;}
.apop-cancel{
  background:transparent;color:var(--accent);border:none;border-radius:4px;
  padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:'Sarabun',sans-serif;transition:background .1s;
}
.apop-cancel:hover{background:var(--accent-lt);}
.apop-save{
  background:var(--accent);color:#fff;border:none;border-radius:4px;
  padding:9px 22px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:'Sarabun',sans-serif;transition:background .1s;
}
.apop-save:hover{background:var(--accent-dk);}

#tip{
  position:fixed;z-index:450;pointer-events:none;display:none;
  background:#3c4043;color:#fff;font-size:12px;line-height:1.5;
  padding:8px 12px;border-radius:8px;box-shadow:0 2px 6px rgba(60,64,67,.3);
  max-width:260px;white-space:pre-line;
}

@media(max-width:900px){
  .app-title{font-size:13px;}
}
@media(max-width:720px){
  .app-sub{display:none;}
  .view-switch a{padding:4px 8px;font-size:11px;}
  .date-chip{font-size:11px;padding:4px 8px 4px 6px;}
}
@media(max-width:560px){
  .logo-text{display:none;}
  .btn-create-label{display:none;}
  .btn-create{padding:5px 8px;}
  .topbar{gap:6px;padding:6px max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));}
  .topbar-actions{gap:6px;}
}
@media(pointer:coarse){
  .task:hover{filter:none;transform:none;}
  .ghost-task.ghost-hover{display:none!important;}
  #tip{font-size:13px;padding:10px 14px;max-width:min(280px,calc(100vw - 16px));}
}
@media(max-height:700px){
  #apop{max-height:calc(100dvh - 24px);overflow:auto;}
}
#apop{max-width:calc(100vw - 24px);}
#tip{max-width:min(260px,calc(100vw - 16px));}

@view-transition{navigation:auto;}
.topbar{view-transition-name:app-topbar;}
.view-switch a.on{view-transition-name:view-pill;}
.view-stage{view-transition-name:app-stage;}
#apop{view-transition-name:app-apop;}
::view-transition-group(app-topbar){z-index:6;}
::view-transition-group(view-pill){z-index:7;}
::view-transition-group(app-stage){z-index:2;}
::view-transition-group(app-apop){z-index:20;}
@keyframes vt-out-l{to{opacity:0;transform:translateX(-40px);}}
@keyframes vt-in-r{from{opacity:0;transform:translateX(40px);}}
@keyframes vt-out-r{to{opacity:0;transform:translateX(40px);}}
@keyframes vt-in-l{from{opacity:0;transform:translateX(-40px);}}
html:active-view-transition-type(to-tasks)::view-transition-old(app-stage){animation:vt-out-l .4s cubic-bezier(.22,1,.36,1) both;}
html:active-view-transition-type(to-tasks)::view-transition-new(app-stage){animation:vt-in-r .4s cubic-bezier(.22,1,.36,1) both;}
html:active-view-transition-type(to-workers)::view-transition-old(app-stage){animation:vt-out-r .4s cubic-bezier(.22,1,.36,1) both;}
html:active-view-transition-type(to-workers)::view-transition-new(app-stage){animation:vt-in-l .4s cubic-bezier(.22,1,.36,1) both;}
html.vt-leave-left .view-stage{animation:vt-out-l .28s ease forwards;}
html.vt-leave-right .view-stage{animation:vt-out-r .28s ease forwards;}
html.vt-enter-left .view-stage{animation:vt-in-l .34s ease;}
html.vt-enter-right .view-stage{animation:vt-in-r .34s ease;}
@media(prefers-reduced-motion:reduce){
  @view-transition{navigation:none;}
  html.vt-leave-left .view-stage,html.vt-leave-right .view-stage,
  html.vt-enter-left .view-stage,html.vt-enter-right .view-stage{animation:none;}
}

<script>
(function(){
  function kind(href){
    try{return /tasks\.html$/i.test(new URL(href,location.href).pathname)?'tasks':'workers';}
    catch{return 'workers';}
  }
  function vtType(from,to){
    if(from===to) return null;
    return to==='tasks'?'to-tasks':'to-workers';
  }
  window.addEventListener('pageswap',e=>{
    if(!e.viewTransition||!e.activation) return;
    const t=vtType(kind((e.activation.from&&e.activation.from.url)||location.href),kind(e.activation.entry.url));
    if(t) e.viewTransition.types.add(t);
  });
  window.addEventListener('pagereveal',e=>{
    if(!e.viewTransition) return;
    const from=e.activation&&e.activation.from&&e.activation.from.url;
    const t=vtType(kind(from||location.href),kind(location.href));
    if(t) e.viewTransition.types.add(t);
    else e.viewTransition.skipTransition();
  });
  document.querySelectorAll('.view-switch a').forEach(a=>{
    a.addEventListener('click',e=>{
      if(a.classList.contains('on')){e.preventDefault();return;}
      if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button!==0) return;
      const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(!reduce && 'startViewTransition' in document) return;
      e.preventDefault();
      const to=kind(a.href);
      document.documentElement.classList.add(to==='tasks'?'vt-leave-left':'vt-leave-right');
      sessionStorage.setItem('viewAnim',to==='tasks'?'to-tasks':'to-workers');
      setTimeout(()=>{location.href=a.href;},260);
    });
  });
  const saved=sessionStorage.getItem('viewAnim');
  if(saved){
    sessionStorage.removeItem('viewAnim');
    if(!('startViewTransition' in document)){
      document.documentElement.classList.add(saved==='to-tasks'?'vt-enter-right':'vt-enter-left');
    }
  }
})();

(function(){
  const TH_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const TH_MONTHS_SHORT=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const TH_DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
  const DEFAULT='2026-09-21';
  const chip=document.getElementById('date-chip');
  const label=document.getElementById('date-label');
  if(!chip||!label) return;
  function pad(n){return String(n).padStart(2,'0');}
  function toIso(y,m,d){return `${y}-${pad(m)}-${pad(d)}`;}
  function parse(s){const[y,m,d]=String(s).split('-').map(Number);return {y,m,d};}
  function fmt(s){
    const {y,m,d}=parse(s);
    if(window.matchMedia('(max-width:560px)').matches) return `${d} ${TH_MONTHS_SHORT[m-1]} ${y+543}`;
    return `${d} ${TH_MONTHS[m-1]} ${y+543}`;
  }
  let selected=sessionStorage.getItem('schedDate')||DEFAULT;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(selected)) selected=DEFAULT;
  label.textContent=fmt(selected);
  let viewY,viewM,pop=null,outHandler=null;
  function closePop(){
    if(pop){pop.remove();pop=null;}
    if(outHandler){document.removeEventListener('pointerdown',outHandler);outHandler=null;}
  }
  function placePop(){
    if(!pop) return;
    const r=chip.getBoundingClientRect();
    const vv=window.visualViewport;
    const vw=vv?vv.width:innerWidth, vh=vv?vv.height:innerHeight;
    const ox=vv?vv.offsetLeft:0, oy=vv?vv.offsetTop:0;
    const pw=pop.offsetWidth, ph=pop.offsetHeight, pad=8;
    let left=r.left+r.width/2-pw/2;
    left=Math.max(ox+pad,Math.min(left,ox+vw-pw-pad));
    let top=r.bottom+8;
    if(top+ph>oy+vh-pad) top=Math.max(oy+pad,r.top-ph-8);
    pop.style.left=left+'px';
    pop.style.top=top+'px';
  }
  function render(){
    if(!pop) return;
    const startDow=new Date(viewY,viewM-1,1).getDay();
    const daysIn=new Date(viewY,viewM,0).getDate();
    const sel=parse(selected);
    const now=new Date();
    const ty=now.getFullYear(),tm=now.getMonth()+1,td=now.getDate();
    let cells='';
    for(let i=0;i<startDow;i++) cells+=`<span class="dpop-cell dpop-empty"></span>`;
    for(let d=1;d<=daysIn;d++){
      const isSel=sel.y===viewY&&sel.m===viewM&&sel.d===d;
      const isToday=ty===viewY&&tm===viewM&&td===d;
      cells+=`<button type="button" class="dpop-cell${isSel?' dpop-sel':''}${isToday?' dpop-today':''}" data-d="${d}">${d}</button>`;
    }
    pop.innerHTML=`<div class="dpop-head">
      <button type="button" class="dpop-nav" data-dir="-1" aria-label="เดือนก่อน">‹</button>
      <div class="dpop-title">${TH_MONTHS[viewM-1]} ${viewY+543}</div>
      <button type="button" class="dpop-nav" data-dir="1" aria-label="เดือนถัดไป">›</button>
    </div>
    <div class="dpop-dow">${TH_DOW.map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="dpop-grid">${cells}</div>`;
    pop.querySelectorAll('.dpop-nav').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        viewM+=+btn.dataset.dir;
        if(viewM<1){viewM=12;viewY--;}
        if(viewM>12){viewM=1;viewY++;}
        render();
        placePop();
      });
    });
    pop.querySelectorAll('.dpop-cell[data-d]').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        selected=toIso(viewY,viewM,+btn.dataset.d);
        sessionStorage.setItem('schedDate',selected);
        label.textContent=fmt(selected);
        closePop();
      });
    });
  }
  function openPop(){
    if(pop){closePop();return;}
    const p=parse(selected);
    viewY=p.y;viewM=p.m;
    pop=document.createElement('div');
    pop.id='dpop';
    document.body.appendChild(pop);
    render();
    placePop();
    setTimeout(()=>{
      outHandler=e=>{if(pop&&!pop.contains(e.target)&&!chip.contains(e.target)) closePop();};
      document.addEventListener('pointerdown',outHandler);
    },0);
  }
  chip.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    openPop();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape') closePop();});
  window.addEventListener('resize',()=>{label.textContent=fmt(selected);if(pop) placePop();});
})();

function toMin(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function minToTime(m){return`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;}
function pad2(n){return String(n).padStart(2,'0');}
function snap(m,step=15){return Math.round(m/step)*step;}
function clamp(m){return Math.max(DAY_START,Math.min(m,DAY_END));}

  const n=String(bg).replace('#','');

  return (r*299+g*587+b*114)/1000>162?'#202124':'#fff';
}

function initial(n){
  let s=String(n).replace(/\s/g,'');
  s=s.replace(/^(พี่|ป้า)/,'');
  for(const ch of s){
    if('เแโใไ'.includes(ch)) continue;
    if(/[ก-ฮ]/.test(ch)) return ch;
    if(/[A-Za-z]/.test(ch)) return ch.toUpperCase();
  }
  return s[0]||'?';
}

let SCALE=2, lastFit=-1;
function tL(m){return(m-DAY_START)*SCALE;}
function tPx(m){return Math.round(tL(m));}
function xToMin(x){return DAY_START+x/SCALE;}
function axisMarks(){
  const t=[];
  for(let m=DAY_START;m<=BREAK_S;m+=30) t.push(m);
  t.push(BREAK_E);
  for(let m=14*60;m<=DAY_END;m+=30) t.push(m);
  return t;
}
function slotAt(m){
  if(m<DAY_START||m>=DAY_END) return null;
  if(m>=BREAK_S&&m<BREAK_E) return null;
  if(m<BREAK_S){
    const s=DAY_START+Math.floor((m-DAY_START)/30)*30;
    return{s,e:Math.min(s+30,BREAK_S)};
  }
  if(m<14*60) return{s:BREAK_E,e:14*60};
  const s=14*60+Math.floor((m-14*60)/30)*30;
  return{s,e:Math.min(s+30,DAY_END)};
}

// ─── Drag & Popover state ───
let drag=null, ghostEl=null, outHandler=null, hoverGhost=null;
function canHover(){return window.matchMedia('(hover:hover) and (pointer:fine)').matches;}
function hideTip(){
  const t=document.getElementById('tip');
  if(t) t.style.display='none';
}
function placeTipAt(x,y){
  const tip=document.getElementById('tip');
  if(!tip||tip.style.display==='none') return;
  const tw=tip.offsetWidth, th=tip.offsetHeight, gap=8, pad=8;
  let px=x+gap, py=y+gap;
  if(px+tw>innerWidth-pad) px=x-tw-gap;
  if(py+th>innerHeight-pad) py=y-th-gap;
  tip.style.left=Math.max(pad,px)+'px';
  tip.style.top=Math.max(pad,py)+'px';
}
function showTapTip(el,e){
  const tip=document.getElementById('tip');
  if(!tip||!el) return;
  const src=el.closest('.task')||el.closest('.who-out')?.previousElementSibling||el;
  const text=src.dataset.tip||el.dataset.tip;
  if(!text) return;
  tip.textContent=text;
  tip.style.display='block';
  const r=el.getBoundingClientRect();
  const x=(e&&e.clientX!=null)?e.clientX:(r.left+r.width/2);
  const y=(e&&e.clientY!=null)?e.clientY:r.bottom;
  placeTipAt(x,y);
}

function hideHoverGhost(){
  if(hoverGhost){hoverGhost.remove();hoverGhost=null;}
}
function ghostLabel(s){
  return`<span>${minToTime(s)}</span>`;
}
function showHoverSlot(area,s,e){
  if(!hoverGhost||hoverGhost.parentNode!==area){
    hideHoverGhost();
    hoverGhost=document.createElement('div');
    hoverGhost.className='ghost-task ghost-hover';
    area.appendChild(hoverGhost);
  }
  hoverGhost.style.left=tL(s)+'px';
  hoverGhost.style.width=Math.max(tL(e)-tL(s),6)+'px';
  hoverGhost.innerHTML=ghostLabel(s);
}

function closePopover(keepGhost){
  const p=document.getElementById('apop');
  if(p)p.remove();
  if(!keepGhost && ghostEl){ghostEl.remove();ghostEl=null;}
  hideHoverGhost();
  if(outHandler){document.removeEventListener('mousedown',outHandler);outHandler=null;}
}

function showPopover(workerIdx, sMin, eMin, anchorRect, keepGhost){
  closePopover(keepGhost);
  const pop=document.createElement('div');
  pop.id='apop';
  pop.innerHTML=`
    <div class="apop-body">
      <div class="apop-hdr">
        <div class="apop-title">เพิ่มงาน</div>
        <button class="apop-x" title="ปิด">✕</button>
      </div>
      <div class="apop-times">
        <div class="t-spin">
          <input class="t-part" id="apop-sh" type="text" inputmode="numeric" maxlength="2" value="${pad2(Math.floor(sMin/60))}">
          <span class="t-colon">:</span>
          <input class="t-part" id="apop-sm" type="text" inputmode="numeric" maxlength="2" value="${pad2(sMin%60)}">
        </div>
        <span class="apop-tsep">–</span>
        <div class="t-spin">
          <input class="t-part" id="apop-eh" type="text" inputmode="numeric" maxlength="2" value="${pad2(Math.floor(eMin/60))}">
          <span class="t-colon">:</span>
          <input class="t-part" id="apop-em" type="text" inputmode="numeric" maxlength="2" value="${pad2(eMin%60)}">
        </div>
      </div>
      <div id="apop-warns"></div>
      <input class="apop-name" id="apop-n" type="text" placeholder="ชื่องาน / เมนู / Batch No." autocomplete="off">
      <div class="apop-who-block">
        <div class="apop-who-lbl">ผู้ปฏิบัติงาน</div>
        <div class="apop-who-list"></div>
        <button type="button" class="apop-who-add">+ เพิ่มผู้ปฏิบัติงาน</button>
      </div>
      <div class="apop-footer">
        <button class="apop-cancel">ยกเลิก</button>
        <button class="apop-save">เพิ่มงาน</button>
      </div>
    </div>`;
  document.body.appendChild(pop);

  const whoList=pop.querySelector('.apop-who-list');
  const whoAdd=pop.querySelector('.apop-who-add');

  function selectedIdxs(){
    return [...whoList.querySelectorAll('.apop-who-sel')].map(s=>parseInt(s.value,10));
  }
  function unusedIdxs(){
    const taken=new Set(selectedIdxs());
    return WORKERS.map((_,i)=>i).filter(i=>!taken.has(i));
  }
  function refreshWho(){
    const taken=selectedIdxs();
    whoList.querySelectorAll('.apop-who-row').forEach(row=>{
      const sel=row.querySelector('.apop-who-sel');
      const cur=parseInt(sel.value,10);
      sel.innerHTML=WORKERS.map((w,i)=>{
        if(taken.includes(i)&&i!==cur) return '';
        return `<option value="${i}"${i===cur?' selected':''}>${w.n}</option>`;
      }).join('');
      row.querySelector('.apop-avatar').textContent=initial(WORKERS[cur].n);
    });
    whoAdd.style.display=unusedIdxs().length?'':'none';
    whoList.querySelectorAll('.apop-who-rm').forEach(b=>{
      b.hidden=whoList.children.length<=1;
    });
  }
  function addWhoRow(idx){
    const pick=idx!=null?idx:unusedIdxs()[0];
    if(pick==null) return;
    const row=document.createElement('div');
    row.className='apop-who-row';
    row.innerHTML=`
      <div class="apop-avatar">${initial(WORKERS[pick].n)}</div>
      <select class="apop-who-sel">${WORKERS.map((w,i)=>`<option value="${i}">${w.n}</option>`).join('')}</select>
      <button type="button" class="apop-who-rm" title="ลบ">✕</button>`;
    row.querySelector('.apop-who-sel').value=String(pick);
    row.querySelector('.apop-who-sel').addEventListener('change',()=>{
      refreshWho();
      updateWarns(readSpin('apop-sh','apop-sm'),readSpin('apop-eh','apop-em'));
    });
    row.querySelector('.apop-who-rm').addEventListener('click',()=>{
      if(whoList.children.length<=1) return;
      row.remove();
      refreshWho();
      updateWarns(readSpin('apop-sh','apop-sm'),readSpin('apop-eh','apop-em'));
      placePopover();
    });
    whoList.appendChild(row);
    refreshWho();
  }

  function validate(s,e){
    const brk=s<BREAK_E&&e>BREAK_S;
    const names=selectedIdxs().filter(idx=>{
      return WORKERS[idx].t.some(tk=>{const ts=toMin(tk.s),te=toMin(tk.e);return s<te&&e>ts;});
    }).map(idx=>WORKERS[idx].n);
    return{brk,ovlp:names.length>0,names};
  }
  function updateWarns(s,e){
    const v=validate(s,e);
    let h='';
    if(v.brk) h+=`<div class="apop-warn warn-brk">🚫 คร่อมพักเบรก 12:30–13:15</div>`;
    if(v.ovlp) h+=`<div class="apop-warn warn-ovlp">⚠️ ทับซ้อนกับงานที่มีอยู่ (${v.names.join(', ')})</div>`;
    document.getElementById('apop-warns').innerHTML=h;
  }

  function placePopover(){
    const vv=window.visualViewport;
    const vw=vv?vv.width:innerWidth, vh=vv?vv.height:innerHeight;
    const ox=vv?vv.offsetLeft:0, oy=vv?vv.offsetTop:0;
    const pad=10, pw=pop.offsetWidth, ph=pop.offsetHeight;
    let px=anchorRect.left+anchorRect.width/2-pw/2;
    px=Math.max(ox+pad,Math.min(px,ox+vw-pw-pad));
    let py=anchorRect.top-ph-14;
    if(py<oy+pad) py=anchorRect.bottom+10;
    if(py+ph>oy+vh-pad) py=Math.max(oy+pad,oy+vh-ph-pad);
    pop.style.left=px+'px';
    pop.style.top=py+'px';
  }
  function readSpin(hId,mId){
    const h=Math.min(23,Math.max(0,parseInt(document.getElementById(hId).value)||0));
    const m=Math.min(59,Math.max(0,parseInt(document.getElementById(mId).value)||0));
    return h*60+m;
  }

  addWhoRow(workerIdx);
  updateWarns(sMin,eMin);
  placePopover();

  ['apop-sh','apop-sm','apop-eh','apop-em'].forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener('input',()=>{
      el.value=el.value.replace(/\D/g,'').slice(0,2);
      updateWarns(readSpin('apop-sh','apop-sm'),readSpin('apop-eh','apop-em'));
    });
    el.addEventListener('blur',()=>{
      const max=id.endsWith('h')?23:59;
      el.value=pad2(Math.min(max,Math.max(0,parseInt(el.value,10)||0)));
    });
  });

  whoAdd.addEventListener('click',()=>{
    addWhoRow();
    updateWarns(readSpin('apop-sh','apop-sm'),readSpin('apop-eh','apop-em'));
    placePopover();
  });

  function doSave(){
    const name=document.getElementById('apop-n').value.trim();
    if(!name){
      const n=document.getElementById('apop-n');
      n.classList.add('apop-err');n.focus();
      setTimeout(()=>n.classList.remove('apop-err'),400);
      return;
    }
    const s=readSpin('apop-sh','apop-sm');
    const e=readSpin('apop-eh','apop-em');
    if(e<=s)return;
    const idxs=[...new Set(selectedIdxs())];
    if(!idxs.length) return;
    idxs.forEach(idx=>{
      WORKERS[idx].t.push({s:minToTime(s),e:minToTime(e),l:name,c:'other'});
    });
    closePopover();build();
  }

  pop.querySelector('.apop-save').addEventListener('click',doSave);
  pop.querySelector('.apop-cancel').addEventListener('click',closePopover);
  pop.querySelector('.apop-x').addEventListener('click',closePopover);
  document.getElementById('apop-n').addEventListener('keydown',e=>{
    if(e.key==='Enter')doSave();
    if(e.key==='Escape')closePopover();
  });

  setTimeout(()=>{
    outHandler=e=>{if(!pop.contains(e.target))closePopover();};
    document.addEventListener('mousedown',outHandler);
  },120);

  document.getElementById('apop-n').focus();
}

let pulseLabel=null;
function normQ(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}
function hit(q,...vals){return !!q&&vals.some(v=>normQ(v).includes(q));}
const searchInput=document.getElementById('job-search');
const searchClear=document.getElementById('job-search-clear');
const searchWrap=document.getElementById('search-wrap');
const searchFab=document.getElementById('search-fab');
let searchQ=normQ(sessionStorage.getItem('jobSearch')||'');
if(searchQ&&searchInput) searchInput.value=sessionStorage.getItem('jobSearch')||'';
function openSearch(){
  if(!searchWrap) return;
  searchWrap.classList.add('open');
  if(searchInput) searchInput.focus();
}
function closeSearch(){
  if(!searchWrap||searchQ) return;
  searchWrap.classList.remove('open');
  if(searchInput) searchInput.blur();
}
function refreshSearchChrome(){
  if(!searchWrap) return;
  const any=document.querySelector('.task-pulse,.row-pulse');
  searchWrap.classList.toggle('has-q',!!searchQ);
  searchWrap.classList.toggle('no-hit',!!searchQ&&!any);
  if(searchQ) searchWrap.classList.add('open');
}
function applyPulse(){
  const q=searchQ;
  const on=!!q||!!pulseLabel;
  document.querySelectorAll('.task').forEach(el=>{
    const match=q?hit(q,el.dataset.l,el.dataset.who):(!!pulseLabel&&el.dataset.l===pulseLabel);
    el.classList.toggle('task-pulse',match);
  });
  document.querySelectorAll('.row').forEach(row=>{
    const who=row.querySelector('.row-name-text')?.textContent||'';
    const nameHit=!!q&&hit(q,who);
    const nameEl=row.querySelector('.row-name');
    if(nameEl) nameEl.classList.toggle('row-pulse',nameHit);
    row.classList.toggle('row-dim',on&&!nameHit&&!row.querySelector('.task-pulse'));
  });
  const gi=document.getElementById('gi');
  if(gi) gi.classList.toggle('is-pulsing',on);
  refreshSearchChrome();
}
function setPulse(label){
  if(searchQ) return;
  pulseLabel=pulseLabel===label?null:label;
  if(!pulseLabel) hideTip();
  applyPulse();
}
function setSearch(raw,scroll){
  const trimmed=String(raw||'').trim();
  searchQ=normQ(trimmed);
  if(searchQ) sessionStorage.setItem('jobSearch',trimmed);
  else sessionStorage.removeItem('jobSearch');
  pulseLabel=null;
  hideTip();
  applyPulse();
  if(scroll&&searchQ){
    const m=document.querySelector('.task-pulse,.row-pulse');
    if(m) m.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
  }
}
if(searchInput){
  searchInput.addEventListener('input',()=>setSearch(searchInput.value,true));
  searchInput.addEventListener('change',()=>setSearch(searchInput.value,true));
}
if(searchFab){
  searchFab.addEventListener('click',()=>{
    if(searchWrap.classList.contains('open')&&!searchQ) closeSearch();
    else openSearch();
  });
}
if(searchClear){
  searchClear.addEventListener('click',()=>{
    if(searchInput){searchInput.value='';searchInput.focus();}
    setSearch('',false);
  });
}
document.addEventListener('pointerdown',e=>{
  if(searchWrap&&!searchWrap.contains(e.target)) closeSearch();
});

// ─── Build ───
function build(){
  if(drag)drag=null;
  closePopover();

  const gs=document.getElementById('gs');
  const avail=Math.max(1,Math.floor(gs.clientWidth-nameW()));
  const UNIT_MIN=15, nUnits=TOTAL/UNIT_MIN;
  const uPx=avail/nUnits>=MIN_U?avail/nUnits:MIN_U;
  const TW=Math.round(uPx*nUnits);
  SCALE=TW/TOTAL;
  const bL=tPx(BREAK_S), bW=tPx(BREAK_E)-bL;

  function tickLabel(a){
    return`${Math.floor(a/60)}:${String(a%60).padStart(2,'0')}`;
  }
  function slotHtml(s,e){
    const x=tPx(s), w=Math.max(0,tPx(e)-x);
    return `<div class="slot" style="left:${x}px;width:${w}px"><span>${tickLabel(s)}-${tickLabel(e)}</span></div>`;
  }

  let ticks='';
  for(const a of axisMarks()){
    if(a===DAY_END){
      ticks+=`<div class="tick tick-end"></div>`;
      continue;
    }
    if(a===BREAK_S||a===BREAK_E) continue;
    ticks+=`<div class="tick" style="left:${tPx(a)}px"></div>`;
  }

  let slots='';
  for(let m=DAY_START;m<BREAK_S;m+=30) slots+=slotHtml(m,m+30);
  slots+=slotHtml(BREAK_E,14*60);
  for(let m=14*60;m<DAY_END;m+=30) slots+=slotHtml(m,m+30);

  document.getElementById('th-inner').style.width=TW+'px';
  document.getElementById('th-clip').style.width=TW+'px';
  document.getElementById('th-inner').style.transform='';
  document.getElementById('th-inner').innerHTML=
    ticks+slots+
    `<div class="brk-th" style="left:${bL}px;width:${bW}px"><span>12:30-13:15</span></div>`;
  document.querySelectorAll('#th-inner .slot span, #th-inner .brk-th span').forEach(sp=>{
    sp.style.transform='';
    const max=sp.parentElement.clientWidth-4;
    const w=sp.scrollWidth;
    if(w>max && max>8) sp.style.transform=`scale(${Math.max(.7,max/w)})`;
  });

  // Rows
  const tip=document.getElementById('tip');
  const html=WORKERS.map((w,wi)=>{
    const avColor=AV_BG;
    let gridLines='';
    for(const a of axisMarks()){
      if(a===DAY_START||a===DAY_END||a===BREAK_S||a===BREAK_E) continue;
      gridLines+=`<div class="vgrid" style="left:${tPx(a)}px"></div>`;
    }
    const tasks=w.t.map(tk=>{
      const col=jobColor(tk.l, tk.c);
      const sMin=toMin(tk.s), eMin=toMin(tk.e);
      const x0=tL(sMin), x1=Math.min(tL(eMin), TW-2);
      return `<div class="task" style="left:${x0}px;width:${Math.max(1,x1-x0)}px;background:${col.bg};"
        data-s="${tk.s}" data-e="${tk.e}" data-l="${tk.l.replace(/"/g,'&quot;')}"
        data-who="${w.n.replace(/"/g,'&quot;')}"
        data-tip="${w.n}\n${tk.s} – ${tk.e}\n${tk.l}">
        <span style="color:${col.fg}">${tk.l}</span>
      </div>`;
    }).join('');
    return `<div class="row">
      <div class="row-name">
        <div class="avatar" style="background:${avColor}">${initial(w.n)}</div>
        <span class="row-name-text">${w.n}</span>
      </div>
      <div class="task-area" style="width:${TW}px">
        ${gridLines}
        <div class="brk-col" style="left:${bL}px;width:${bW}px"></div>
        ${tasks}
      </div>
    </div>`;
  }).join('');

  document.getElementById('gi').innerHTML=html;
  lastFit=gs.clientWidth;

  function placeTip(e){
    if(!canHover()) return;
    placeTipAt(e.clientX,e.clientY);
  }
  document.querySelectorAll('.task').forEach(el=>{
    el.addEventListener('mouseenter',e=>{
      if(!canHover()) return;
      tip.textContent=el.dataset.tip;tip.style.display='block';placeTip(e);
    });
    el.addEventListener('mousemove',placeTip);
    el.addEventListener('mouseleave',()=>{
      if(!canHover()) return;
      hideTip();
    });
    el.addEventListener('click',e=>{
      e.stopPropagation();
      setPulse(el.dataset.l);
      if(!canHover()){
        if(pulseLabel) showTapTip(el,e);
        else hideTip();
      }
    });
  });
  applyPulse();

  // Hover slot preview + drag-to-create
  document.querySelectorAll('.task-area').forEach((area,idx)=>{
    area.addEventListener('mousemove',e=>{
      if(!canHover()||drag||document.getElementById('apop'))return;
      if(e.target.closest('.task,.brk-col')){hideHoverGhost();return;}
      const rect=area.getBoundingClientRect();
      const sl=slotAt(xToMin(e.clientX-rect.left));
      if(!sl){hideHoverGhost();return;}
      showHoverSlot(area,sl.s,sl.e);
    });
    area.addEventListener('mouseleave',hideHoverGhost);
    area.addEventListener('mousedown',e=>{
      if(!canHover())return;
      if(e.button!==0||e.target.closest('.task,.brk-col'))return;
      e.preventDefault();
      const rect=area.getBoundingClientRect();
      const sl=slotAt(xToMin(e.clientX-rect.left));
      if(!sl)return;
      hideHoverGhost();
      const sMin=sl.s, eMin=sl.e;
      const ghost=document.createElement('div');
      ghost.className='ghost-task ghost-sel';
      ghost.innerHTML=ghostLabel(sMin);
      ghost.style.left=tL(sMin)+'px';
      ghost.style.width=(tL(eMin)-tL(sMin))+'px';
      area.appendChild(ghost);
      ghostEl=ghost;
      drag={workerIdx:idx,area,sMin,curMin:eMin,ghost,x0:e.clientX};
    });
  });
}

// ─── Document events ───
document.addEventListener('mousemove',e=>{
  if(!drag)return;
  const rect=drag.area.getBoundingClientRect();
  const curMin=clamp(snap(Math.max(drag.sMin+15,xToMin(e.clientX-rect.left))));
  drag.curMin=curMin;
});

document.addEventListener('mouseup',e=>{
  if(!drag)return;
  const d=drag;drag=null;
  const ghostRect=d.ghost.getBoundingClientRect();
  showPopover(d.workerIdx,d.sMin,d.curMin,ghostRect,true);
});

document.getElementById('btn-create').addEventListener('click',e=>{
  showPopover(0,DAY_START,DAY_START+30,e.currentTarget.getBoundingClientRect());
});
document.getElementById('gs').addEventListener('click',e=>{
  if(!e.target.closest('.task')&&!searchQ) setPulse(null);
});
document.getElementById('gs').addEventListener('scroll',()=>{
  const t=document.getElementById('tip');
  if(t) t.style.display='none';
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  closePopover();
  if(searchQ){
    if(searchInput) searchInput.value='';
    setSearch('',false);
    closeSearch();
    return;
  }
  if(searchWrap&&searchWrap.classList.contains('open')){
    closeSearch();
    return;
  }
  setPulse(null);
});

build();
requestAnimationFrame(()=>{lastFit=-1;build();});
let rt;
function scheduleBuild(){
  const w=document.getElementById('gs').clientWidth;
  if(w===lastFit) return;
  clearTimeout(rt);rt=setTimeout(build,80);
}
window.addEventListener('resize',scheduleBuild);
if(window.visualViewport) visualViewport.addEventListener('resize',scheduleBuild);
if(typeof ResizeObserver!=='undefined'){
  new ResizeObserver(scheduleBuild).observe(document.getElementById('gs'));
}
</script>
